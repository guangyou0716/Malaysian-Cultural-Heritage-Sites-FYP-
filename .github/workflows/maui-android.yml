name: MAUI Android

on:
  pull_request:
    paths:
      - "PenangGoAppFresh/**"
      - "PenangGoApp.DataAccess/**"
      - ".github/workflows/maui-android.yml"
  push:
    branches:
      - master
    paths:
      - "PenangGoAppFresh/**"
      - "PenangGoApp.DataAccess/**"
      - ".github/workflows/maui-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        working-directory: PenangGoAppFresh
        run: dotnet workload install maui-android

      - name: Build
        run: dotnet build PenangGoAppFresh/PenangGoAppFresh.csproj -f net10.0-android -c Release
