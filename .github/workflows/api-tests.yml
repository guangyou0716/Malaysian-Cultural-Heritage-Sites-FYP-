name: API tests

on:
  pull_request:
    paths:
      - "PenangGoApi/**"
      - "PenangGoApi.Tests/**"
      - "PenangGoApp.DataAccess/**"
      - "global.json"
      - ".github/workflows/api-tests.yml"
  push:
    branches:
      - master
    paths:
      - "PenangGoApi/**"
      - "PenangGoApi.Tests/**"
      - "PenangGoApp.DataAccess/**"
      - "global.json"
      - ".github/workflows/api-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PenangGoApi.Tests/PenangGoApi.Tests.csproj

      - name: Build
        run: dotnet build PenangGoApi.Tests/PenangGoApi.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test PenangGoApi.Tests/PenangGoApi.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
