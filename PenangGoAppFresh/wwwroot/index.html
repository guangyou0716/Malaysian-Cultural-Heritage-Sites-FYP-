<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PenangGoAppFresh</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/materials.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/utilities.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="PenangGoAppFresh.styles.css" />
    <link rel="stylesheet" href="css/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        window.penangGoTheme = {
            apply: function (theme) { document.documentElement.setAttribute('data-theme', theme); },
            setReducedMotion: function (enabled) { document.documentElement.setAttribute('data-reduce-motion', enabled ? 'true' : 'false'); }
        };
    </script>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/leaflet-blazor.js"></script>
    <script src="js/panorama-viewer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

</body>

</html>
